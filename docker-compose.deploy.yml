# One public URL: the "web" service (nginx → API + static UI).
# For Railway, Render, etc.: point HTTPS / public HTTP at container port 80 (map host 8080 below for local tests).
# Set OPENAI_API_KEY and JINA_API_KEY in the platform UI or in a root .env for compose interpolation.
# Needs roughly 2 GB+ RAM for Elasticsearch + API + nginx.

services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms256m -Xmx256m"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    networks:
      - atria
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -sf http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=50s >/dev/null || exit 1",
        ]
      interval: 15s
      timeout: 60s
      retries: 12
      start_period: 60s

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      ELASTIC_URL: http://elasticsearch:9200
      PORT: "8000"
      AUTO_INGEST_SYNTHETIC_DEMO: "1"
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      JINA_API_KEY: ${JINA_API_KEY}
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
      ELEVENLABS_VOICE_ID: ${ELEVENLABS_VOICE_ID:-EXAVITQu4vr4xnSDxMaL}
      ELEVENLABS_MODEL_ID: ${ELEVENLABS_MODEL_ID:-eleven_multilingual_v2}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - atria
    restart: unless-stopped

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        VITE_BACKEND_URL: ""
    environment:
      API_UPSTREAM: api:8000
    ports:
      - "8080:80"
    depends_on:
      - api
    networks:
      - atria
    restart: unless-stopped

volumes:
  elasticsearch_data:

networks:
  atria:
    driver: bridge
