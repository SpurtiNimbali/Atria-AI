services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: ehr-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    networks:
      - ehr-network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -sf http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=50s >/dev/null || exit 1",
        ]
      interval: 10s
      timeout: 60s
      retries: 10
      start_period: 40s

  kibana:
    image: docker.elastic.co/kibana/kibana:8.11.0
    container_name: ehr-kibana
    ports:
      - "5601:5601"
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    depends_on:
      - elasticsearch
    networks:
      - ehr-network

  # API + ES (Vercel hosts the UI): docker compose --profile backend up -d --build
  # Full stack (UI in Docker too): docker compose --profile fullstack up -d --build
  api:
    profiles: ["fullstack", "backend"]
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ehr-api
    env_file:
      - .env
    environment:
      ELASTIC_URL: http://elasticsearch:9200
      PORT: "8000"
    ports:
      - "8000:8000"
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - ehr-network
    restart: unless-stopped

  web:
    profiles: ["fullstack"]
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        VITE_BACKEND_URL: ""
    container_name: ehr-web
    ports:
      - "8080:80"
    depends_on:
      - api
    networks:
      - ehr-network
    restart: unless-stopped

volumes:
  elasticsearch_data:
    driver: local

networks:
  ehr-network:
    driver: bridge
